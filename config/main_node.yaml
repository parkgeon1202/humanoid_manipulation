manipulation_node_cpp:
  ros__parameters:
    control_topic: /dynamixel_control
    gripper_topic: /gripper_control
    status_topic: /motor_status

    # 그립 모터(6번) 정지 판정: |velocity| < moving_velocity_threshold이면 정지로 봄.
    # 정지 시 |position - gripper.closed_deg| <= near_zero_position_threshold면
    # (완전히 닫힘 자리까지 다 갔으면) 아무것도 못 집은 것으로 판정하고 PICK_READY로
    # 재시도. velocity가 uint8 raw 값이 아니라 부호 있는 rad/s로 바뀐 뒤(2026-08-04)
    # 다시 튜닝한 값. near_zero_position_threshold: 완전히 닫힘(raw 1630) ~ 최대
    # 크기 공을 잡았을 때 멈추는 자리(raw 1800) 사이가 약 0.26rad(170틱)뿐이라, 그
    # 중 "사실상 못 집음"으로 볼 여유분을 0.1rad(약 65틱)로 좁게 잡음.
    grip.moving_velocity_threshold: 0.35
    grip.near_zero_position_threshold: 0.15

    # velocity가 threshold 밑으로 이 tick 수만큼 연속으로 유지돼야 "진짜 멈췄다"로
    # 확정함(1틱만 보고 확정하면 정지 마찰/토크 리플로 인한 순간적인 속도 저하를
    # 오탐해서 훨씬 덜 오므린 채로 그립 완료 처리되는 문제가 있었음).
    grip.stopped_streak_ticks: 10

    # COMPLETE_GRIP 모션(74번) 종료 후 그립이 실제로 됐는지 확인차 그립 모터를
    # 살짝 움직이는(kick) 목표각(rad).
    grip.wiggle_kick_position_rad: 0.2

    # --- 아래는 구 ik_solve_node.yaml에서 병합됨(ik_solve_node.py가 fsm.cpp로
    # 흡수되면서 별도 프로세스/yaml이 없어짐). 값은 debug_ik_node.yaml에서 이번
    # 세션에 실측으로 튜닝된 값과 동일하게 맞춤(같은 로봇이므로).

    # IK를 한 번에 수렴시키지 않고 이 주기(초)로 한 스텝씩만 진행.
    ik.step_period_sec: 0.02

    # LM(Levenberg-Marquardt) damping 관련 값들. 스텝이 도움이 되면
    # damping *= damping_decrease_factor(최소 min_damping까지), 악화시키거나
    # self-collision이면 damping *= damping_increase_factor(최대 max_damping까지).
    ik.default_damping: 0.001
    ik.min_damping: 0.000001
    ik.max_damping: 100.0
    ik.damping_decrease_factor: 0.5
    ik.damping_increase_factor: 2.0

    # 한 스텝에서 "목표에 도달했다"고 볼 위치 오차(m).
    ik.tol: 0.003

    # 매 스텝 QP로 구한 "이상적인" 보정량 중 실제로 적용할 비율(학습률).
    ik.alpha: 0.5

    # Trust-region ratio(rho) 판정 기준.
    ik.trust_region_good_ratio: 0.75
    ik.trust_region_acceptable_ratio: 0.1

    # ik_step 내부의 weighted 정규화 계수: [torso_yaw, l_shoulder_pitch,
    # l_shoulder_roll, l_elbow_pitch]. 값이 클수록 그 관절을 더 아껴 씀(torso_yaw는
    # 1로 웬만하면 torso로 풀게 유도, joint_weight_scale과 짝).
    ik.joint_weights: [1.0, 5.0, 1.0, 10.0]

    # PLACE(VIRTUAL_PLACE) 전용 joint_weights - PICK과 반대로 torso_yaw를 더
    # 아끼고(허리를 덜 쓰고) 팔 위주로 풀게 함. state_changed 시점에
    # active_joint_weights_로 스냅샷돼서 stepReachableIk가 씀(solveTickImpl 참고).
    ik.place_joint_weights: [1.0, 1.0, 1.0, 1.0]

    # COMPLETE_PLACE(역재생 홈잉) 전용 joint_weights - torso_yaw를 크게 아껴서
    # (100) 돌아올 때 허리 대신 팔 위주로 풀게 함. stepCompletePlaceHoming
    # state_changed에서 active_joint_weights_로 스냅샷됨(ik.joint_weight_scale과
    # 같이 켜져야 실제로 적용됨).
    ik.complete_place_joint_weights: [1.0, 1.0, 1.0, 1.0]

    # VIRTUAL_PLACE 팔 궤적의 정점(장애물 회피용 경유점, base_link 기준 x/y, m) -
    # 시작(현재 EE)과 최종 목표(비전 캡처값) 사이에 이 지점을 거쳐가게 함.
    place.apex_x: 0.1
    place.apex_y: 0.2
    # 시작->정점->목표 전체 궤적 재생 시간(초).
    place.traj_duration_sec: 1.0

    # VIRTUAL_PLACE place_tol_ 유동 조정 폭(m, runDampedIkTick/stepPlaceIk 참고) - rho/
    # damping으로 "진짜 스텝을 밟았는지"부터 걸러낸 뒤에만 스트릭을 세므로(fsm.hpp
    # place_tol_increase_step_m 필드 주석 참고) 늘리는/줄이는 쪽을 비대칭으로 둘 근거가
    # 없어져서 같은 값으로 맞춤. 연속 10번 진짜로 실패(rho 나쁨/충돌 반려)하면
    # tol_increase_step_m씩 풀어주고(상한 kPlaceTolMaxM=10cm), 연속 10번 진짜로 좋은
    # 스텝(rho 좋음)이면 tol_decrease_step_m씩 조여줌(하한 ik.tol).
    place.tol_increase_step_m: 0.01
    place.tol_decrease_step_m: 0.01

    # 그리퍼를 열기 전 마지막 Cartesian 안전판(fsm.hpp place_release_max_error_m 필드
    # 주석 참고) - 실측 관절값 기준 EE가 target_pos_에서 이 값보다 멀면 그리퍼를 안
    # 열고 재수렴시킴.
    place.release_max_error_m: 0.1

    # PICK 접근 궤적(PICK_READY -> PICK 전이 시점의 EE -> 비전 캡처 목표, 2점) 전체
    # 소요 시간(초) - place와 달리 정점 없이 직행.
    pick.approach_duration_sec: 1.0

    # COMPLETE_GRIP 진입 시 집은 자세의 EE(FK)에서 z를 이만큼(m) 들어올린 지점을
    # 새 IK 목표로 풀어서 안전하게 들고 있는 자세를 잡음.
    pick.complete_grip_lift_z_m: 0.1

    # 위 z+lift 목표로 실측이 도달했다고 볼 settle 임계값(fsm.hpp
    # complete_grip_settle_*_threshold 필드 주석 참고) - 공용 ik.torso_settle_*
    # 임계값과 별개로 이 대기 전용. 실측으로 이 구간 settle이 15~20초까지 걸리는 걸
    # 확인해서(대화 참고) 일부러 더 느슨하게 잡음 - 실기 테스트로 더 튜닝 필요.
    pick.complete_grip_settle_velocity_threshold: 0.6
    pick.complete_grip_settle_position_tolerance_rad: 0.6

    # joint_weights 앞에 곱해지는 고정 세기. damping과 독립적으로 둠(damping에
    # 얹으면 수렴이 잘 될수록 이 항이 무의미해짐).
    ik.joint_weight_scale: 0.2

    # null-space 2차목표(현재는 그리퍼 방향 정렬(eeOrientationAlignmentDq) 전용 -
    # elbowTorsoAvoidanceDq 충돌회피는 당분간 안 씀) 가중치. EE 위치 오차 항(가중치
    # 1)과 견줄 만큼 방향 정렬도 중요하게 다루려고 크게 잡음(실기에서 더 튜닝 필요).
    ik.secondary_gain: 1.0

    # 그리퍼가 물건을 위에서(top-down) 잡도록, ee_link_1 로컬 Z축을 world 아래
    # 방향(-Z)에 정렬시키는 gradient pull 세기.
    ik.orientation_align_k_pull: 1.0

    # (현재 미사용 - elbowTorsoAvoidanceDq 호출 안 함) left_elbow_1-torso_1 메쉬
    # 사이 거리가 이보다(m) 가까워지면 secondary_dq에 벌어지는 방향이 더해짐.
    # collision_model.cpp가 원래 링크 로컬 AABB 박스로 충돌을 근사했을 때는 "정상
    # 자세"도 이미 거리가 ~1.5mm로 잡혀서(박스가 실제 부피보다 훨씬 큼) 1mm까지
    # 낮췄었는데, 실제 메쉬(BVH)로 바꾼 뒤 재보니 home 자세 기준 실거리는 5~9mm
    # 사이임 - 그래도 실제로 팔을 뻗어 목표에 다가갈 때는 1mm 밑으로도 충분히
    # 가까워지므로(실측 확인), 항상 켜져있지 않으면서도 진짜 근접할 때는 반응하도록
    # 완만하게 올림(실기 테스트로 6mm까지 조정).
    ik.collision_avoidance_threshold_m: 0.006
    ik.collision_avoidance_k_pull: 1.0

    # PICK에서 damping이 이만큼 연속 틱 동안 상한에 붙어있으면(=hard 충돌 반려가
    # 반복돼서 더 못 나아가는 상태) "막혔다"고 보고 torso_yaw 킥으로 탈출 시도.
    ik.stuck_streak_ticks: 100

    # 막혔을 때 목표-현재 EE의 y 오차 부호를 보고 현재 torso_yaw에서 +/- 이만큼(rad)
    # 돌림(고정 후보 목록을 순서대로 대입하던 이전 방식 대체 - 목표 쪽 방향으로
    # 킥하므로 엉뚱한 방향 시행착오가 줄어듦).
    ik.torso_kick_step_rad: 0.5

    # torso_yaw 킥과 함께 팔꿈치도 이 각도(rad)만큼 굽혀서 리셋함. 펴둔 채로(0.0)
    # 두면 다리/공을 치는 경우가 있어서 굽힘.
    ik.elbow_kick_rad: 0.0

    # 위와 동일한 이유로 어깨 pitch도 0.0 대신 이 각도(rad)로 리셋함.
    ik.left_shoulder_pitch_kick_rad: -2.7

    # PICK_READY 진입 시 비전을 캡처하기 전에 먼저 돌아갈 대기 자세(rad):
    # [torso_yaw, left_shoulder_pitch, left_shoulder_roll, left_elbow_pitch].
    # torso_yaw(첫 값)는 stepPickReady가 비전 y 부호로 매번 다시 정해서 덮어쓰므로
    # 여기 값은 실제로 안 쓰임(아래 ik.pick_ready_torso_bias_rad 참고) - 자리만
    # 맞추려고 0.0으로 둠. left_shoulder_pitch는 ik.left_shoulder_pitch_kick_rad와
    # 동일하게 -2.7로, left_shoulder_roll은 ik.left_shoulder_roll_target_rad와
    # 동일하게 0.3으로, left_elbow_pitch는 ik.elbow_kick_rad와 동일하게 0.0으로 맞춤.
    pick_ready_home_q: [0.0, -2.7, 0.3, 0.0]

    # PICK_READY 진입 시 torso_yaw를 이 크기(rad)만큼 비전 y가 가리키는 쪽으로
    # 미리 기울여둠(y가 오른쪽/음수면 -이 값, 왼쪽/양수면 +이 값) - 그 방향에서
    # 도달 가능 IK를 시작하면 더 빨리 수렴함. left_shoulder_roll_target_rad는
    # 정체 킥 리셋 때만 씀.
    ik.left_shoulder_roll_target_rad: 0.3
    ik.pick_ready_torso_bias_rad: 1.0

    # 비전 y값의 실측 오프셋(m) - 비전을 캡처하는 순간(PICK_READY의 torso 편향
    # 결정, VIRTUAL_PLACE의 IK 목표 둘 다) target_pos_.y()에서 이 값을 빼서 보정함.
    ik.vision_y_offset: 0.016

    # "모터가 목표에 도달했다"는 판정 전부(위 허리+어깨 회전은 물론, COMPLETE_PLACE에서
    # 팔을 0.0으로 홈잉할 때도) 이 두 값을 공유해서 씀 - 위치/속도 둘 다 만족해야
    # 도달로 봄(속도만 보면 회전 명령 직후 첫 틱에 오판할 수 있음). velocity는
    # rad/s가 아니라 CurrentMotorStatus.velocity의 raw uint8 단위.
    ik.torso_settle_velocity_threshold: 0.3
    ik.torso_settle_position_tolerance_rad: 0.3

    # 그리퍼 열림/닫힘 목표 각도(도). 한 번에 목표로 명령하고 실제 이동 속도는
    # profile_velocity(1.0)에 맡김 - 더 이상 매 tick 조금씩 당기지 않음. closed_deg는
    # 다이나믹셀 raw 1630틱(모터 자체 위치 단위)을 rad으로 변환한 값
    # ((1630/4095)*2pi - pi ≈ -0.640593rad)을 다시 도(deg)로 바꾼 것 - 실제 완전히
    # 닫히는 위치가 0도가 아니라 이 값이라 그대로 맞춤.
    gripper.open_deg: 25.0
    gripper.closed_deg: -36.7033
    # VIRTUAL_PLACE에서 물건을 놓을 때 벌리는 각도(도) - gripper.open_deg(PICK_READY
    # 진입용)와 별개. 확실히 떨어뜨리려면 더 크게 벌려야 할 수 있어서 넉넉하게 잡음.
    gripper.place_open_deg: 65.0
    # VIRTUAL_PLACE에서 그리퍼를 벌릴 때 left_shoulder_pitch도 그 순간 실측값 기준으로
    # 이만큼(도) 같이 돌림 - 그리퍼 모터와 연결된 프레임이 놓는 자세에서 그리퍼
    # 아래쪽으로 가버려서 모터만 돌고 실제로는 안 놓아지는 문제 대응.
    gripper.place_release_shoulder_pitch_offset_deg: 38.0
    # 위와 같은 시점(그리퍼 벌릴 때 딱 한 번)에 elbow_pitch도 그 순간 실측값 기준으로
    # 이만큼(도) 같이 돌림 - shoulder_pitch만으로 부족할 때 팔꿈치까지 보태서 프레임을
    # 확실히 빼냄.
    gripper.place_release_elbow_offset_deg: -20.0
