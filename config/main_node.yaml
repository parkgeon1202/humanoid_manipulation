manipulation_node_cpp:
  ros__parameters:
    control_topic: /dynamixel_control
    status_topic: /motor_status

    # 그립 모터(6번) 정지 판정: |velocity| < moving_velocity_threshold이면 정지로 봄.
    # 정지 시 |position| <= near_zero_position_threshold면 아무것도 못 집은 것으로
    # 판정하고 PICK_READY로 재시도.
    grip.moving_velocity_threshold: 0.3
    grip.near_zero_position_threshold: 0.2

    # COMPLETE_GRIP 모션(74번) 종료 후 그립이 실제로 됐는지 확인차 그립 모터를
    # 살짝 움직이는(kick) 목표각(rad).
    grip.wiggle_kick_position_rad: 1.0

    # --- 아래는 구 ik_solve_node.yaml에서 병합됨(ik_solve_node.py가 fsm.cpp로
    # 흡수되면서 별도 프로세스/yaml이 없어짐). 값은 debug_ik_node.yaml에서 이번
    # 세션에 실측으로 튜닝된 값과 동일하게 맞춤(같은 로봇이므로).

    # IK를 한 번에 수렴시키지 않고 이 주기(초)로 한 스텝씩만 진행.
    ik.step_period_sec: 0.02

    # LM(Levenberg-Marquardt) damping 관련 값들. 스텝이 도움이 되면
    # damping *= damping_decrease_factor(최소 min_damping까지), 악화시키거나
    # self-collision이면 damping *= damping_increase_factor(최대 max_damping까지).
    ik.default_damping: 0.001
    ik.min_damping: 0.000001
    ik.max_damping: 100.0
    ik.damping_decrease_factor: 0.5
    ik.damping_increase_factor: 2.0

    # 한 스텝에서 "목표에 도달했다"고 볼 위치 오차(m).
    ik.tol: 0.0001

    # 매 스텝 QP로 구한 "이상적인" 보정량 중 실제로 적용할 비율(학습률).
    ik.alpha: 0.5

    # Trust-region ratio(rho) 판정 기준.
    ik.trust_region_good_ratio: 0.75
    ik.trust_region_acceptable_ratio: 0.1

    # ik_step 내부의 weighted 정규화 계수: [torso_yaw, l_shoulder_pitch,
    # l_shoulder_roll, l_elbow_pitch]. 값이 클수록 그 관절을 더 아껴 씀. 왼팔을
    # 10배 아껴서(torso_yaw는 1) 웬만하면 torso로 풀게 유도(joint_weight_scale과 짝).
    ik.joint_weights: [1.0, 10.0, 10.0, 10.0]

    # joint_weights 앞에 곱해지는 고정 세기. damping과 독립적으로 둠(damping에
    # 얹으면 수렴이 잘 될수록 이 항이 무의미해짐).
    ik.joint_weight_scale: 0.005

    # null-space 2차목표(elbow_torso_avoidance_dq) 가중치. 0.0이면 2차목표가
    # 통째로 꺼짐.
    ik.secondary_gain: 0.01

    # left_elbow_1-torso_1 메쉬 사이 거리가 이보다(m) 가까워지면 secondary_dq에
    # 벌어지는 방향이 더해짐. collision_model.cpp가 원래 링크 로컬 AABB 박스로
    # 충돌을 근사했을 때는 "정상 자세"도 이미 거리가 ~1.5mm로 잡혀서(박스가 실제
    # 부피보다 훨씬 큼) 1mm까지 낮췄었는데, 실제 메쉬(BVH)로 바꾼 뒤 재보니 home
    # 자세 기준 실거리는 5~9mm 사이임 - 그래도 실제로 팔을 뻗어 목표에 다가갈 때는
    # 1mm 밑으로도 충분히 가까워지므로(실측 확인), 항상 켜져있지 않으면서도 진짜
    # 근접할 때는 반응하도록 3mm로 완만하게 올림.
    ik.collision_avoidance_threshold_m: 0.003
    ik.collision_avoidance_k_pull: 1.0

    # PICK에서 damping이 이만큼 연속 틱 동안 상한에 붙어있으면(=hard 충돌 반려가
    # 반복돼서 더 못 나아가는 상태) "막혔다"고 보고 torso_kick_offsets로 탈출 시도.
    ik.stuck_streak_ticks: 30

    # 막혔을 때 torso_yaw에 순서대로 강제로 대입해볼 후보 값들(rad).
    ik.torso_kick_offsets: [0.5, 1.0, 1.5, -0.5, -1.0, -1.5]

    # PICK_READY 진입 시 비전을 캡처하기 전에 먼저 돌아갈 대기 자세(rad):
    # [torso_yaw, left_shoulder_pitch, left_shoulder_roll, left_elbow_pitch].
    # left_shoulder_roll은 ik.left_shoulder_roll_target_rad와 동일하게 1.0으로 맞춤.
    pick_ready_home_q: [0.0, 0.0, 1.0, 0.0]

    # PICK_READY: 비전을 캡처한 직후 허리+왼쪽 어깨 롤을 이 각도(rad)까지 고정
    # 회전시키고, 그 상태를 도달 가능 IK의 시작점으로 씀. torso_yaw/shoulder_roll은
    # fixed_indices가 아니라 IK가 계속 자유롭게 움직일 수 있는 관절이라, 이 값은
    # "시작점"일 뿐 최종 각도가 아님.
    ik.torso_target_rad: -1.5
    ik.left_shoulder_roll_target_rad: 1.0

    # "모터가 목표에 도달했다"는 판정 전부(위 허리+어깨 회전은 물론, COMPLETE_PLACE에서
    # 팔을 0.0으로 홈잉할 때도) 이 두 값을 공유해서 씀 - 위치/속도 둘 다 만족해야
    # 도달로 봄(속도만 보면 회전 명령 직후 첫 틱에 오판할 수 있음). velocity는
    # rad/s가 아니라 CurrentMotorStatus.velocity의 raw uint8 단위.
    ik.torso_settle_velocity_threshold: 0.3
    ik.torso_settle_position_tolerance_rad: 0.05

    # 그리퍼 열림/닫힘/스텝 각도(도).
    gripper.open_deg: 30.0
    gripper.closed_deg: 0.0
    gripper.step_deg: 0.6
